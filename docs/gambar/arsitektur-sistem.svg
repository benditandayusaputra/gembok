<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1130" viewBox="0 0 1400 1130" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a38bdf8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="aa78bfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="af59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="acbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="afb7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker></defs><rect width="1400" height="1130" rx="20" fill="#0b1120"/><text x="48" y="52" font-size="28" fill="#e2e8f0" font-weight="800" text-anchor="start">Arsitektur GEMBOK</text><text x="48" y="80" font-size="15" fill="#94a3b8" font-weight="400" text-anchor="start">Chip identitas tahan kuantum: ML-KEM (FIPS 203) dengan kunci dari PUF, di DE10-Nano (Intel Cyclone V 5CSEBA6U23I7), clock 50 MHz</text><rect x="40" y="118" width="1320" height="168" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="58" y="105" width="228.99999999999997" height="26" rx="13" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5"/><text x="70" y="123" font-size="14" fill="#38bdf8" font-weight="700" text-anchor="start">HPS: ARM Cortex-A9, Linux</text><rect x="64" y="146" width="400" height="118" rx="12" fill="#131f3a" stroke="#334155" stroke-width="1.5"/><rect x="64" y="146" width="6" height="118" rx="3" fill="#38bdf8"/><text x="84" y="174" font-size="16" fill="#38bdf8" font-weight="700" text-anchor="start">gembok-cli</text><text x="450" y="173" font-size="12" fill="#94a3b8" font-weight="500" text-anchor="end">sw/hps</text><text x="84" y="198" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">Driver C11 lewat /dev/mem (0xFF240000)</text><text x="84" y="218" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">selftest, 240 vektor NIST, mode brankas</text><text x="84" y="238" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">karakterisasi PUF (bangunan debug)</text><rect x="500" y="146" width="400" height="118" rx="12" fill="#131f3a" stroke="#334155" stroke-width="1.5"/><rect x="500" y="146" width="6" height="118" rx="3" fill="#38bdf8"/><text x="520" y="174" font-size="16" fill="#38bdf8" font-weight="700" text-anchor="start">gembok-verifier</text><text x="886" y="173" font-size="12" fill="#94a3b8" font-weight="500" text-anchor="end">sw/verifier, Go</text><text x="520" y="198" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">Penerbit sertifikat LMS (RFC 8554)</text><text x="520" y="218" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">Encaps tantangan, cek tag bukti</text><text x="520" y="238" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">API HTTP, ulang PUF_RECON sampai 5 kali</text><rect x="936" y="146" width="400" height="118" rx="12" fill="#131f3a" stroke="#334155" stroke-width="1.5"/><rect x="936" y="146" width="6" height="118" rx="3" fill="#38bdf8"/><text x="956" y="174" font-size="16" fill="#38bdf8" font-weight="700" text-anchor="start">Dasbor demo</text><text x="1322" y="173" font-size="12" fill="#94a3b8" font-weight="500" text-anchor="end">sw/dashboard</text><text x="956" y="198" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">SvelteKit, dibuka dari laptop atau HP</text><text x="956" y="218" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">Daftarkan, Periksa: ASLI atau PALSU</text><text x="956" y="238" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">adegan chip tiruan, coba baca kunci</text><polyline points="934,205 902,205" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#a38bdf8)" marker-start="url(#a38bdf8)"/><text x="918" y="232" font-size="12" fill="#38bdf8" font-weight="600" text-anchor="middle">HTTP</text><rect x="40" y="306" width="1320" height="46" rx="12" fill="#131f3a" stroke="#a78bfa" stroke-width="1.5"/><text x="700" y="335" font-size="15" fill="#a78bfa" font-weight="600" text-anchor="middle">Jembatan lightweight HPS-to-FPGA: AXI ke Avalon-MM, data 32 bit, rentang 64 KB, latensi baca 1 siklus</text><polyline points="264,264 264,304" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#aa78bfa)" marker-start="url(#aa78bfa)"/><polyline points="700,264 700,304" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#aa78bfa)" marker-start="url(#aa78bfa)"/><rect x="40" y="384" width="1320" height="690" rx="18" fill="#0f172a" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="58" y="371" width="237.2" height="26" rx="13" fill="#0b1120" stroke="#34d399" stroke-width="1.5"/><text x="70" y="389" font-size="14" fill="#34d399" font-weight="700" text-anchor="start">FPGA: IP gembok_top (rtl/)</text><rect x="64" y="414" width="540" height="146" rx="12" fill="#131f3a" stroke="#334155" stroke-width="1.5"/><rect x="64" y="414" width="6" height="146" rx="3" fill="#a78bfa"/><text x="84" y="442" font-size="16" fill="#a78bfa" font-weight="700" text-anchor="start">avmm_bridge</text><text x="590" y="441" font-size="12" fill="#94a3b8" font-weight="500" text-anchor="end">Avalon-MM slave</text><text x="84" y="466" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">Register: ID, VERSION, CTRL, STATUS, PARAM, CTXLEN,</text><text x="84" y="486" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">CYCLES, CAPS, COOLDOWN, PROOFS, PUF_THRESH, PUF_DBG</text><text x="84" y="506" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">Jendela memori byte di 0x8000 (1 byte per kata)</text><text x="84" y="526" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">· cmd_pend: register dan memori terkunci sejak</text><text x="84" y="546" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">· siklus sesudah CTRL ditulis</text><polyline points="344,352 344,412" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#aa78bfa)" marker-start="url(#aa78bfa)"/><rect x="676" y="414" width="660" height="146" rx="12" fill="#131f3a" stroke="#334155" stroke-width="1.5"/><rect x="676" y="414" width="6" height="146" rx="3" fill="#f59e0b"/><text x="696" y="442" font-size="16" fill="#f59e0b" font-weight="700" text-anchor="start">vault (brankas)</text><text x="1322" y="441" font-size="12" fill="#94a3b8" font-weight="500" text-anchor="end">rtl/vault.sv</text><text x="696" y="466" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">Kunci PUF 256 bit hanya di register, keluar ke inti saat grant</text><text x="696" y="486" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">Penjaga akses: saat sibuk baca = 0 dan tulis dibuang</text><text x="696" y="506" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">Hapus rahasia sesudah DAFTAR dan BUKTIKAN, WIPE saat boot</text><text x="696" y="526" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">· Pembatas laju BUKTIKAN (sekitar 21 ms), tahan reset</text><text x="696" y="546" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">· Kebijakan perintah dan kode galat</text><polyline points="604,476 674,476" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#aa78bfa)"/><text x="640" y="466" font-size="12.5" fill="#a78bfa" font-weight="600" text-anchor="middle">perintah</text><polyline points="674,506 604,506" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#aa78bfa)"/><text x="640" y="526" font-size="12.5" fill="#a78bfa" font-weight="600" text-anchor="middle">status</text><rect x="676" y="596" width="320" height="150" rx="12" fill="#131f3a" stroke="#334155" stroke-width="1.5"/><rect x="676" y="596" width="6" height="150" rx="3" fill="#fb7185"/><text x="696" y="624" font-size="16" fill="#fb7185" font-weight="700" text-anchor="start">puf_ro</text><text x="982" y="623" font-size="12" fill="#94a3b8" font-weight="500" text-anchor="end">PUF</text><text x="696" y="648" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">768 osilator cincin</text><text x="696" y="668" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">(1 NAND + 4 inverter)</text><text x="696" y="688" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">token pilih pasangan c, c+1</text><text x="696" y="708" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">· pencacah 20 bit:</text><text x="696" y="728" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">· pembagi dua + 19 bit</text><rect x="1016" y="596" width="320" height="150" rx="12" fill="#131f3a" stroke="#334155" stroke-width="1.5"/><rect x="1016" y="596" width="6" height="150" rx="3" fill="#fb7185"/><text x="1036" y="624" font-size="16" fill="#fb7185" font-weight="700" text-anchor="start">fuzzy_extractor</text><text x="1036" y="648" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">pilih 256 pasangan andal</text><text x="1036" y="668" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">voting mayoritas, 5 suara</text><text x="1036" y="688" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">topeng + nilai cek (publik)</text><text x="1036" y="708" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">· data bantu yang diubah</text><text x="1036" y="728" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">· selalu ditolak</text><polyline points="996,660 1014,660" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#afb7185)"/><polyline points="1176,596 1176,562" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#af59e0b)"/><text x="1186" y="584" font-size="12.5" fill="#f59e0b" font-weight="600" text-anchor="start">bit kunci</text><rect x="64" y="596" width="560" height="150" rx="12" fill="#131f3a" stroke="#334155" stroke-width="1.5"/><rect x="64" y="596" width="6" height="150" rx="3" fill="#34d399"/><text x="84" y="624" font-size="16" fill="#34d399" font-weight="700" text-anchor="start">mlkem_ctrl (pengendali)</text><text x="610" y="623" font-size="12" fill="#94a3b8" font-weight="500" text-anchor="end">FIPS 203</text><text x="84" y="648" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">Tabel langkah ucode_rom: 250 langkah, 25 opcode</text><text x="84" y="668" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">KEYGEN, ENCAPS, DECAPS, CHECK_EK, CHECK_DK,</text><text x="84" y="688" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">ENROLL, PROVE, PUF_SEAL, PUF_OPEN, WIPE_ALL</text><text x="84" y="708" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">· pencacah i, j, N, tumpukan panggilan 2 tingkat</text><text x="84" y="728" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">· penolakan implisit tanpa cabang (CSEL)</text><polyline points="760,560 760,578 560,578 560,594" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#af59e0b)"/><text x="572" y="590" font-size="12.5" fill="#f59e0b" font-weight="600" text-anchor="start">program, k, byte kunci (saat grant)</text><rect x="64" y="790" width="302" height="140" rx="12" fill="#131f3a" stroke="#334155" stroke-width="1.5"/><rect x="64" y="790" width="6" height="140" rx="3" fill="#34d399"/><text x="84" y="818" font-size="16" fill="#34d399" font-weight="700" text-anchor="start">keccak_core</text><text x="352" y="817" font-size="12" fill="#94a3b8" font-weight="500" text-anchor="end">FIPS 202</text><text x="84" y="842" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">SHA3-256, SHA3-512</text><text x="84" y="862" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">SHAKE128, SHAKE256</text><text x="84" y="882" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">1 ronde per siklus</text><text x="84" y="902" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">24 siklus per permutasi</text><rect x="384" y="790" width="302" height="140" rx="12" fill="#131f3a" stroke="#334155" stroke-width="1.5"/><rect x="384" y="790" width="6" height="140" rx="3" fill="#34d399"/><text x="404" y="818" font-size="16" fill="#34d399" font-weight="700" text-anchor="start">sampler</text><text x="404" y="842" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">SampleNTT (Alg. 7)</text><text x="404" y="862" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">CBD eta 2 dan eta 3</text><text x="404" y="882" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">(Alg. 8)</text><text x="404" y="902" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">1 kata per siklus</text><rect x="704" y="790" width="302" height="140" rx="12" fill="#131f3a" stroke="#334155" stroke-width="1.5"/><rect x="704" y="790" width="6" height="140" rx="3" fill="#34d399"/><text x="724" y="818" font-size="16" fill="#34d399" font-weight="700" text-anchor="start">codec</text><text x="724" y="842" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">ByteEncode, ByteDecode</text><text x="724" y="862" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">Compress, Decompress</text><text x="724" y="882" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">cek modulus Bag. 7.2</text><text x="724" y="902" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">1 byte per siklus</text><rect x="1024" y="790" width="302" height="140" rx="12" fill="#131f3a" stroke="#334155" stroke-width="1.5"/><rect x="1024" y="790" width="6" height="140" rx="3" fill="#34d399"/><text x="1044" y="818" font-size="16" fill="#34d399" font-weight="700" text-anchor="start">poly_arith</text><text x="1044" y="842" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">NTT, NTT invers, PWM, LIN</text><text x="1044" y="862" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">1 butterfly per siklus</text><text x="1044" y="882" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">modmul Barrett, 3 DSP</text><text x="1044" y="902" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">zeta_rom</text><line x1="215" y1="768" x2="1175" y2="768" stroke="#34d399" stroke-width="2"/><line x1="344" y1="746" x2="344" y2="768" stroke="#34d399" stroke-width="2"/><text x="354" y="761" font-size="12.5" fill="#34d399" font-weight="600" text-anchor="start">jalankan primitif</text><polyline points="215,768 215,788" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#a34d399)"/><polyline points="535,768 535,788" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#a34d399)"/><polyline points="855,768 855,788" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#a34d399)"/><polyline points="1175,768 1175,788" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#a34d399)"/><rect x="64" y="960" width="560" height="92" rx="12" fill="#131f3a" stroke="#334155" stroke-width="1.5"/><rect x="64" y="960" width="6" height="92" rx="3" fill="#cbd5e1"/><text x="84" y="988" font-size="16" fill="#cbd5e1" font-weight="700" text-anchor="start">byte_mem: 8 KB (M10K)</text><text x="84" y="1012" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">EK, CT, DK, benih d z m, K, H(ek), TAG, konteks,</text><text x="84" y="1032" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">topeng dan nilai cek data bantu PUF</text><rect x="676" y="960" width="660" height="92" rx="12" fill="#131f3a" stroke="#334155" stroke-width="1.5"/><rect x="676" y="960" width="6" height="92" rx="3" fill="#cbd5e1"/><text x="696" y="988" font-size="16" fill="#cbd5e1" font-weight="700" text-anchor="start">poly_mem: 2048 x 24 bit (M10K)</text><text x="696" y="1012" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">16 slot polinomial, 2 koefisien per kata</text><text x="696" y="1032" font-size="13.5" fill="#e2e8f0" font-weight="400" text-anchor="start">dua port: dua butterfly per baca, satu pengali bergantian</text><polyline points="204,930 204,958" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#acbd5e1)" marker-start="url(#acbd5e1)"/><polyline points="526,930 526,958" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#acbd5e1)" marker-start="url(#acbd5e1)"/><polyline points="850,930 850,958" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#acbd5e1)" marker-start="url(#acbd5e1)"/><polyline points="1170,930 1170,958" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#acbd5e1)" marker-start="url(#acbd5e1)"/><line x1="64" y1="1098" x2="104" y2="1098" stroke="#f59e0b" stroke-width="2.5"/><text x="114" y="1103" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">jalur kunci rahasia: tidak pernah menyentuh bus, dihapus sesudah tiap operasi</text><line x1="760" y1="1098" x2="800" y2="1098" stroke="#a78bfa" stroke-width="2"/><text x="810" y="1103" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">jalur yang bisa dicapai host (hanya data publik saat chip diam)</text></svg>
