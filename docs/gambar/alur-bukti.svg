<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1090" viewBox="0 0 1400 1090" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif"><defs><marker id="a16808a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#16808a" stroke-width="1.6"/></marker><marker id="a2a6496" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2a6496" stroke-width="1.6"/></marker><marker id="a2b2b2b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2b2b2b" stroke-width="1.6"/></marker><marker id="a2e7d4f" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#2e7d4f" stroke-width="1.6"/></marker><marker id="a5b3f99" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#5b3f99" stroke-width="1.6"/></marker><marker id="a5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#5f6b7a" stroke-width="1.6"/></marker><marker id="ab3261e" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#b3261e" stroke-width="1.6"/></marker><marker id="ac2621a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#c2621a" stroke-width="1.6"/></marker></defs><rect width="1400" height="1090" fill="#ffffff"/><text x="48" y="50" font-size="22" fill="#1a1a1a" font-weight="700" text-anchor="start">Alur pendaftaran dan pembuktian keaslian</text><text x="48" y="80" font-size="15" fill="#5a5a5a" font-weight="400" text-anchor="start">Pemeriksa tidak pernah melihat kunci rahasia chip. Yang dikirim balik hanya bukti 32 byte yang terikat pada tantangan dan konteks.</text><rect x="130" y="104" width="340" height="64" rx="0" fill="#eaf2f9" stroke="#2a6496" stroke-width="1.6"/><text x="300" y="132" font-size="17" fill="#2a6496" font-weight="700" text-anchor="middle">Pemeriksa</text><text x="300" y="154" font-size="13" fill="#5a5a5a" font-weight="400" text-anchor="middle">gembok-verifier di HPS</text><line x1="300" y1="168" x2="300" y2="1050" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="6 4"/><rect x="930" y="104" width="340" height="64" rx="0" fill="#eaf5ee" stroke="#2e7d4f" stroke-width="1.6"/><text x="1100" y="132" font-size="17" fill="#2e7d4f" font-weight="700" text-anchor="middle">Chip GEMBOK</text><text x="1100" y="154" font-size="13" fill="#5a5a5a" font-weight="400" text-anchor="middle">IP di FPGA</text><line x1="1100" y1="168" x2="1100" y2="1050" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="6 4"/><rect x="40" y="196" width="1320" height="372" rx="0" fill="none" stroke="#c2621a" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="54" y="187" width="308.4" height="18" fill="#ffffff"/><text x="60" y="201" font-size="13.5" fill="#c2621a" font-weight="700" text-anchor="start">1. Pendaftaran, sekali saat chip dibuat</text><polyline points="300,236 1092,236" fill="none" stroke="#c2621a" stroke-width="1.4" marker-end="url(#ac2621a)"/><text x="700" y="227" font-size="14" fill="#c2621a" font-weight="700" text-anchor="middle" font-family="'Courier New', Courier, monospace">PUF_ENROLL</text><rect x="890" y="252" width="420" height="78" rx="0" fill="#ffffff" stroke="#c2621a" stroke-width="1.3"/><text x="1100" y="277" font-size="13" fill="#1a1a1a" font-weight="700" text-anchor="middle">ukur 768 osilator, pilih 256 pasangan andal</text><text x="1100" y="297" font-size="13" fill="#5a5a5a" font-weight="400" text-anchor="middle">kunci PUF 256 bit tetap di brankas</text><text x="1100" y="317" font-size="13" fill="#5a5a5a" font-weight="400" text-anchor="middle">keluar: topeng + nilai cek (data bantu publik)</text><polyline points="1100,356 308,356" fill="none" stroke="#c2621a" stroke-width="1.4" marker-end="url(#ac2621a)"/><text x="700" y="347" font-size="14" fill="#c2621a" font-weight="700" text-anchor="middle" font-family="'Courier New', Courier, monospace">data bantu (publik)</text><polyline points="300,398 1092,398" fill="none" stroke="#2e7d4f" stroke-width="1.4" marker-end="url(#a2e7d4f)"/><text x="700" y="389" font-size="14" fill="#2e7d4f" font-weight="700" text-anchor="middle" font-family="'Courier New', Courier, monospace">ENROLL (DAFTAR)</text><polyline points="1100,440 308,440" fill="none" stroke="#2e7d4f" stroke-width="1.4" marker-end="url(#a2e7d4f)"/><text x="700" y="431" font-size="14" fill="#2e7d4f" font-weight="700" text-anchor="middle" font-family="'Courier New', Courier, monospace">kunci publik ek, H(ek)</text><text x="700" y="461" font-size="12" fill="#5a5a5a" font-weight="400" text-anchor="middle" font-style="italic">(d, z) = SHAKE256(label || kunci PUF), lalu KeyGen, rahasia dihapus</text><rect x="100" y="476" width="400" height="78" rx="0" fill="#ffffff" stroke="#2a6496" stroke-width="1.3"/><text x="300" y="501" font-size="13" fill="#1a1a1a" font-weight="700" text-anchor="middle">penerbit menandatangani sertifikat</text><text x="300" y="521" font-size="13" fill="#5a5a5a" font-weight="400" text-anchor="middle">LMS atas (id chip, ek, H(ek)),</text><text x="300" y="541" font-size="13" fill="#5a5a5a" font-weight="400" text-anchor="middle">disimpan bersama data bantu</text><rect x="40" y="598" width="1320" height="460" rx="0" fill="none" stroke="#2e7d4f" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="54" y="589" width="156.4" height="18" fill="#ffffff"/><text x="60" y="603" font-size="13.5" fill="#2e7d4f" font-weight="700" text-anchor="start">2. Tiap pemeriksaan</text><polyline points="300,640 1092,640" fill="none" stroke="#c2621a" stroke-width="1.4" marker-end="url(#ac2621a)"/><text x="700" y="631" font-size="14" fill="#c2621a" font-weight="700" text-anchor="middle" font-family="'Courier New', Courier, monospace">data bantu + PUF_RECON</text><text x="700" y="661" font-size="12" fill="#5a5a5a" font-weight="400" text-anchor="middle" font-style="italic">saat menyala; diulang sampai 5 kali bila derau</text><rect x="100" y="680" width="400" height="58" rx="0" fill="#ffffff" stroke="#2a6496" stroke-width="1.3"/><text x="300" y="705" font-size="13" fill="#1a1a1a" font-weight="700" text-anchor="middle">cek tanda tangan sertifikat</text><text x="300" y="725" font-size="13" fill="#5a5a5a" font-weight="400" text-anchor="middle">(K, c) = Encaps(ek), K acak 32 byte</text><polyline points="300,786 1092,786" fill="none" stroke="#2e7d4f" stroke-width="1.4" marker-end="url(#a2e7d4f)"/><text x="700" y="777" font-size="14" fill="#2e7d4f" font-weight="700" text-anchor="middle" font-family="'Courier New', Courier, monospace">c + konteks, PROVE (BUKTIKAN)</text><rect x="880" y="802" width="440" height="78" rx="0" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.3"/><text x="1100" y="827" font-size="13" fill="#1a1a1a" font-weight="700" text-anchor="middle">bangun ulang kunci dari PUF, KeyGen, Decaps(c) = K&#x27;</text><text x="1100" y="847" font-size="13" fill="#5a5a5a" font-weight="400" text-anchor="middle">tag = SHA3-256(&quot;GEMBOK-v1/bukti&quot; || K&#x27; || len || ctx)</text><text x="1100" y="867" font-size="13" fill="#5a5a5a" font-weight="400" text-anchor="middle">hapus semua rahasia, 0,907 ms (ML-KEM-768)</text><polyline points="1100,906 308,906" fill="none" stroke="#2e7d4f" stroke-width="1.4" marker-end="url(#a2e7d4f)"/><text x="700" y="897" font-size="14" fill="#2e7d4f" font-weight="700" text-anchor="middle" font-family="'Courier New', Courier, monospace">tag 32 byte</text><rect x="90" y="926" width="420" height="58" rx="0" fill="#ffffff" stroke="#2a6496" stroke-width="1.3"/><text x="300" y="951" font-size="13" fill="#1a1a1a" font-weight="700" text-anchor="middle">bandingkan tag dalam waktu konstan</text><text x="300" y="971" font-size="13" fill="#5a5a5a" font-weight="400" text-anchor="middle">sama berarti ASLI, beda berarti PALSU</text><rect x="880" y="946" width="440" height="58" rx="0" fill="#ffffff" stroke="#b3261e" stroke-width="1.6"/><text x="1100" y="971" font-size="13" fill="#1a1a1a" font-weight="700" text-anchor="middle">chip tiruan: PUF lain, data bantu ditolak</text><text x="1100" y="991" font-size="13" fill="#5a5a5a" font-weight="400" text-anchor="middle">atau K&#x27; berbeda, jadi tag tidak cocok</text></svg>
