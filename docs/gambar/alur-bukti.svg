<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1090" viewBox="0 0 1400 1090" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a38bdf8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="aa78bfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="af59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="acbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="afb7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker></defs><rect width="1400" height="1090" rx="20" fill="#0b1120"/><text x="48" y="52" font-size="28" fill="#e2e8f0" font-weight="800" text-anchor="start">Alur pendaftaran dan pembuktian keaslian</text><text x="48" y="80" font-size="15" fill="#94a3b8" font-weight="400" text-anchor="start">Pemeriksa tidak pernah melihat kunci rahasia chip. Yang dikirim balik hanya bukti 32 byte yang terikat pada tantangan dan konteks.</text><rect x="130" y="104" width="340" height="64" rx="14" fill="#131f3a" stroke="#38bdf8" stroke-width="1.5"/><text x="300" y="132" font-size="18" fill="#38bdf8" font-weight="700" text-anchor="middle">Pemeriksa</text><text x="300" y="154" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle">gembok-verifier di HPS</text><line x1="300" y1="168" x2="300" y2="1050" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/><rect x="930" y="104" width="340" height="64" rx="14" fill="#131f3a" stroke="#34d399" stroke-width="1.5"/><text x="1100" y="132" font-size="18" fill="#34d399" font-weight="700" text-anchor="middle">Chip GEMBOK</text><text x="1100" y="154" font-size="13" fill="#94a3b8" font-weight="400" text-anchor="middle">IP di FPGA</text><line x1="1100" y1="168" x2="1100" y2="1050" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/><rect x="40" y="196" width="1320" height="372" rx="16" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="3 6"/><rect x="56" y="184" width="336" height="24" rx="12" fill="#0b1120" stroke="#fb7185"/><text x="68" y="201" font-size="13.5" fill="#fb7185" font-weight="700" text-anchor="start">1. Pendaftaran, sekali saat chip dibuat</text><polyline points="300,236 1092,236" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#afb7185)"/><text x="700" y="226" font-size="14" fill="#fb7185" font-weight="600" text-anchor="middle">PUF_ENROLL</text><rect x="890" y="252" width="420" height="78" rx="10" fill="#131f3a" stroke="#fb7185" stroke-width="1.5"/><text x="1100" y="277" font-size="13.5" fill="#e2e8f0" font-weight="600" text-anchor="middle">ukur 768 osilator, pilih 256 pasangan andal</text><text x="1100" y="297" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="middle">kunci PUF 256 bit tetap di brankas</text><text x="1100" y="317" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="middle">keluar: topeng + nilai cek (data bantu publik)</text><polyline points="1100,356 308,356" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#afb7185)"/><text x="700" y="346" font-size="14" fill="#fb7185" font-weight="600" text-anchor="middle">data bantu (publik)</text><polyline points="300,398 1092,398" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#a34d399)"/><text x="700" y="388" font-size="14" fill="#34d399" font-weight="600" text-anchor="middle">ENROLL (DAFTAR)</text><polyline points="1100,440 308,440" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#a34d399)"/><text x="700" y="430" font-size="14" fill="#34d399" font-weight="600" text-anchor="middle">kunci publik ek, H(ek)</text><text x="700" y="462" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">(d, z) = SHAKE256(label || kunci PUF), lalu KeyGen, rahasia dihapus</text><rect x="100" y="476" width="400" height="78" rx="10" fill="#131f3a" stroke="#38bdf8" stroke-width="1.5"/><text x="300" y="501" font-size="13.5" fill="#e2e8f0" font-weight="600" text-anchor="middle">penerbit menandatangani sertifikat</text><text x="300" y="521" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="middle">LMS atas (id chip, ek, H(ek)),</text><text x="300" y="541" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="middle">disimpan bersama data bantu</text><rect x="40" y="598" width="1320" height="460" rx="16" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 6"/><rect x="56" y="586" width="176" height="24" rx="12" fill="#0b1120" stroke="#34d399"/><text x="68" y="603" font-size="13.5" fill="#34d399" font-weight="700" text-anchor="start">2. Tiap pemeriksaan</text><polyline points="300,640 1092,640" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#afb7185)"/><text x="700" y="630" font-size="14" fill="#fb7185" font-weight="600" text-anchor="middle">data bantu + PUF_RECON</text><text x="700" y="662" font-size="12.5" fill="#94a3b8" font-weight="400" text-anchor="middle">saat menyala; diulang sampai 5 kali bila derau</text><rect x="100" y="680" width="400" height="58" rx="10" fill="#131f3a" stroke="#38bdf8" stroke-width="1.5"/><text x="300" y="705" font-size="13.5" fill="#e2e8f0" font-weight="600" text-anchor="middle">cek tanda tangan sertifikat</text><text x="300" y="725" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="middle">(K, c) = Encaps(ek), K acak 32 byte</text><polyline points="300,786 1092,786" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#a34d399)"/><text x="700" y="776" font-size="14" fill="#34d399" font-weight="600" text-anchor="middle">c + konteks, PROVE (BUKTIKAN)</text><rect x="880" y="802" width="440" height="78" rx="10" fill="#131f3a" stroke="#34d399" stroke-width="1.5"/><text x="1100" y="827" font-size="13.5" fill="#e2e8f0" font-weight="600" text-anchor="middle">bangun ulang kunci dari PUF, KeyGen, Decaps(c) = K&#x27;</text><text x="1100" y="847" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="middle">tag = SHA3-256(&quot;GEMBOK-v1/bukti&quot; || K&#x27; || len || ctx)</text><text x="1100" y="867" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="middle">hapus semua rahasia, 0,907 ms (ML-KEM-768)</text><polyline points="1100,906 308,906" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#a34d399)"/><text x="700" y="896" font-size="14" fill="#34d399" font-weight="600" text-anchor="middle">tag 32 byte</text><rect x="90" y="926" width="420" height="58" rx="10" fill="#131f3a" stroke="#38bdf8" stroke-width="1.5"/><text x="300" y="951" font-size="13.5" fill="#e2e8f0" font-weight="600" text-anchor="middle">bandingkan tag dalam waktu konstan</text><text x="300" y="971" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="middle">sama berarti ASLI, beda berarti PALSU</text><rect x="880" y="946" width="440" height="58" rx="10" fill="#131f3a" stroke="#f59e0b" stroke-width="1.5"/><text x="1100" y="971" font-size="13.5" fill="#e2e8f0" font-weight="600" text-anchor="middle">chip tiruan: PUF lain, data bantu ditolak</text><text x="1100" y="991" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="middle">atau K&#x27; berbeda, jadi tag tidak cocok</text></svg>
