<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEMBOK Simulasi 3D</title>
<meta name="description" content="Simulasi 3D pemeriksaan dokumen ber-chip GEMBOK di autogate, meja HRD, gudang cukai, dan pintu ruang server, dengan ML-KEM-768 dan LMS yang berjalan di peramban.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<style>
:root{
  --kaca:rgba(14,19,27,.66);--kaca2:rgba(255,255,255,.05);--tepi:rgba(255,255,255,.09);
  --teks:#e9eef4;--redup:#9aa7b6;--samar:#6b7787;
  --biru:#4aa3ff;--ok:#2fd67b;--gagal:#ff4d4d;--oranye:#ff9a3c;--ungu:#a98bff;--toska:#33d1c6;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#10151c;color:var(--teks);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--biru)}
#dunia{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
.kaca{background:var(--kaca);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--tepi);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
header.atas{position:fixed;left:16px;right:16px;top:14px;height:54px;display:flex;align-items:center;gap:14px;padding:0 10px 0 16px;z-index:5}
.merek{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.bendera{width:22px;height:15px;border-radius:2px;background:linear-gradient(#e70011 50%,#fff 50%);box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.merek small{font-weight:500;letter-spacing:0;color:var(--redup)}
nav.kasus{display:flex;gap:6px;margin:0 auto}
nav.kasus button{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 12px;color:var(--redup);white-space:nowrap}
nav.kasus button i{width:8px;height:8px;border-radius:50%;background:var(--w)}
nav.kasus button[aria-selected="true"]{background:var(--kaca2);border-color:var(--tepi);color:var(--teks)}
nav.kasus button:disabled{cursor:not-allowed}
.aksi{display:flex;gap:8px;align-items:center}
.pil{border:1px solid var(--tepi);background:var(--kaca2);border-radius:9px;padding:6px 10px;font-size:13px;color:var(--teks);text-decoration:none;white-space:nowrap}
.bahasa{display:flex;border:1px solid var(--tepi);border-radius:9px;overflow:hidden}
.bahasa button{border:0;background:transparent;padding:6px 10px;font-size:12.5px;color:var(--redup)}
.bahasa button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:var(--teks)}
aside.panel{position:fixed;top:82px;bottom:16px;z-index:4;display:flex;flex-direction:column;overflow:hidden}
aside.kiri{left:16px;width:332px}
aside.kanan{right:16px;width:372px}
.gulir{overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.kepala{padding:16px 18px 12px;border-bottom:1px solid var(--tepi)}
.kepala .kecil{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--redup);display:flex;align-items:center;gap:8px}
.kepala .kecil i{width:7px;height:7px;border-radius:50%;background:var(--w,var(--biru));box-shadow:0 0 10px var(--w,var(--biru))}
.kepala h2{margin:6px 0 2px;font-size:19px;line-height:1.25}
.kepala p{margin:0;color:var(--redup);font-size:13px}
.blok{padding:14px 18px;border-bottom:1px solid var(--tepi)}
.blok:last-child{border-bottom:0}
.blok h3{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--redup);font-weight:600}
dl.data{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
dl.data dt{color:var(--redup)}
dl.data dd{margin:0}
dl.data dd.mono{font-family:var(--mono);font-size:12.5px}
.penerbit{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--redup);margin-bottom:10px}
.penerbit b{color:var(--teks);font-weight:600}
.penerbit code{font-family:var(--mono);color:var(--ungu);font-size:12px}
.bilah{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;position:relative;min-width:40px}
.bilah i{position:absolute;inset:0;width:40%;background:var(--ungu);border-radius:2px;animation:geser 1.2s ease-in-out infinite}
@keyframes geser{0%{left:-40%}100%{left:100%}}
.penerbit.siap .bilah{display:none}
.tombol{width:100%;border:0;border-radius:10px;padding:11px 14px;font-weight:600;background:linear-gradient(180deg,#5aa9ff,#2f7fe0);color:#fff;box-shadow:0 8px 24px rgba(47,127,224,.35)}
.tombol:disabled{background:rgba(255,255,255,.08);color:var(--samar);box-shadow:none;cursor:not-allowed}
ul.pabrik{list-style:none;margin:10px 0 0;padding:0;display:none}
ul.pabrik.tampil{display:block}
ul.pabrik li{display:flex;gap:10px;padding:6px 0;font-size:12.5px}
ul.pabrik li i{flex:none;width:3px;border-radius:2px;background:var(--w)}
ul.pabrik b{display:block;font-weight:600;font-size:13px}
ul.pabrik span{color:var(--redup);overflow-wrap:anywhere}
.pilihan{display:grid;gap:8px}
.pilihan button{display:block;text-align:left;border:1px solid var(--tepi);background:var(--kaca2);border-radius:10px;padding:10px 12px 10px 14px;position:relative;overflow:hidden}
.pilihan button::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--w)}
.pilihan button b{display:block;font-size:13.5px}
.pilihan button span{display:block;font-size:12px;color:var(--redup);margin-top:2px;line-height:1.35}
.pilihan button:hover:not(:disabled){background:rgba(255,255,255,.09)}
.pilihan button.aktif{border-color:var(--w);background:rgba(255,255,255,.08)}
.pilihan button:disabled{opacity:.42;cursor:not-allowed}
.konteks{font-size:12px;color:var(--redup);margin-top:8px}
.konteks code{display:block;margin-top:4px;font-family:var(--mono);font-size:11.5px;color:var(--teks);background:rgba(255,255,255,.05);border:1px solid var(--tepi);border-radius:7px;padding:5px 8px;overflow-wrap:anywhere}
ol.jejak{list-style:none;margin:0;padding:4px 18px}
ol.jejak li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);opacity:.38}
ol.jejak li:last-child{border-bottom:0}
ol.jejak li.jalan,ol.jejak li.ok,ol.jejak li.gagal{opacity:1}
ol.jejak li.lewat{opacity:.3}
.ikon{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--redup)}
li.jalan .ikon{border-color:var(--biru);border-top-color:transparent;animation:putar .8s linear infinite;color:transparent}
@keyframes putar{to{transform:rotate(360deg)}}
li.ok .ikon{background:var(--ok);border-color:var(--ok);color:#06210f}
li.gagal .ikon{background:var(--gagal);border-color:var(--gagal);color:#2a0606}
.jejak b{display:block;font-size:13.5px}
.jejak p{margin:2px 0 0;font-size:12.5px;color:var(--redup)}
.jejak .wkt{font-family:var(--mono);font-size:11px;color:var(--samar);padding-top:3px;white-space:nowrap}
.kosong{padding:22px 18px;color:var(--redup);font-size:13px}
.banding{display:none;padding:12px 18px 16px;border-top:1px solid var(--tepi)}
.banding.tampil{display:block}
.banding span{display:block;font-size:11.5px;color:var(--redup);margin-top:6px}
.heks{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere;line-height:1.5}
.heks i{font-style:normal}
.heks i.sama{color:var(--ok)}
.heks i.beda{color:var(--gagal)}
.putusan{position:fixed;left:50%;top:96px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:14px;padding:12px 22px 12px 14px;border-radius:14px;opacity:0;pointer-events:none}
.putusan .cap{font-size:26px;font-weight:700;letter-spacing:.14em;padding:4px 14px;border:2.5px solid currentColor;border-radius:8px}
.putusan.asli{color:var(--ok)}
.putusan.palsu{color:var(--gagal)}
.putusan p{margin:0;color:var(--teks);font-size:14px;max-width:340px}
.putusan small{display:block;color:var(--redup);font-size:12px;margin-top:2px}
.petunjuk{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;font-size:12px;color:var(--redup);padding:7px 12px;border-radius:999px;white-space:nowrap}
.muat{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#10151c;transition:opacity .6s}
.muat.hilang{opacity:0;pointer-events:none}
.muat div{text-align:center;color:var(--redup);font-size:13px}
.muat b{display:block;color:var(--teks);font-size:18px;letter-spacing:.1em;margin-bottom:8px}
.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(5,8,12,.55)}
.modal.buka{display:grid}
.modal .isi{max-width:760px;width:calc(100% - 32px);padding:22px 24px}
.modal h2{margin:0 0 12px;font-size:20px}
.modal .tiga{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.modal .tiga div{border-top:3px solid var(--w);padding-top:10px}
.modal h3{margin:0 0 6px;font-size:14px}
.modal p{margin:0;color:var(--redup);font-size:13px}
.modal .tutup{margin-top:18px;width:auto;padding:9px 18px}
#cap{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:9;width:max-content;max-width:min(820px,calc(100% - 760px));background:rgba(10,14,20,.9);border:1px solid var(--tepi);border-left:6px solid var(--ok);border-radius:10px;padding:12px 18px;font-size:22px;font-weight:600;line-height:1.3;opacity:0;pointer-events:none;box-shadow:0 14px 40px rgba(0,0,0,.4)}
body.rekam .petunjuk{display:none}
body.rekam aside.kiri{display:none}
body.rekam aside.kanan{width:360px}
body.rekam #cap{left:16px;transform:none;max-width:calc(100% - 410px);font-size:20px}
body.rekam .putusan{left:calc(50% - 188px)}
@media (max-width:1180px){
  aside.kiri{width:300px}
  aside.kanan{width:330px}
  nav.kasus button span{display:none}
}
@media (max-width:900px){
  html,body{overflow:auto;height:auto}
  body{display:flex;flex-direction:column}
  #dunia{position:relative;inset:auto;order:1;flex:none;height:56vh;z-index:1}
  aside.kiri{order:2}
  aside.kanan{order:3}
  header.atas{position:sticky;left:auto;right:auto;top:0;margin:0;border-radius:0;height:auto;flex-wrap:wrap;padding:10px 16px;gap:8px;z-index:7}
  .merek small{display:none}
  nav.kasus{order:3;width:100%;overflow-x:auto}
  nav.kasus button span{display:inline}
  aside.panel{position:relative;top:auto;bottom:auto;left:auto;right:auto;width:auto;margin:12px 16px;overflow:visible;z-index:2}
  .gulir{overflow:visible}
  .putusan{top:auto;bottom:16px;position:fixed;width:calc(100% - 32px)}
  .putusan p{max-width:none}
  .petunjuk{display:none}
  .modal .tiga{grid-template-columns:1fr}
}
</style>
</head>
<body>
<canvas id="dunia" aria-label="Adegan 3D"></canvas>

<div class="muat" id="muat"><div><b>GEMBOK</b><span data-t="memuat"></span></div></div>

<header class="atas kaca">
  <div class="merek"><span class="bendera" aria-hidden="true"></span>GEMBOK <small data-t="sub"></small></div>
  <nav class="kasus" id="kasus" role="tablist"></nav>
  <div class="aksi">
    <button class="pil" id="bukaInfo" data-t="tentang"></button>
    <a class="pil" href="../" data-t="model3d"></a>
    <div class="bahasa" role="group" aria-label="Bahasa">
      <button data-bahasa="id" aria-pressed="true">ID</button>
      <button data-bahasa="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<aside class="panel kiri kaca">
  <div class="kepala" id="kepalaKiri"><div class="kecil"><i></i><span data-t="dokumen"></span></div><h2 id="judulKasus"></h2><p id="pemeriksa"></p></div>
  <div class="gulir">
    <div class="blok"><dl class="data" id="data"></dl></div>
    <div class="blok">
      <div class="penerbit" id="penerbit"><b data-t="penerbit"></b><span id="penerbitStatus"></span><span class="bilah"><i></i></span><code id="penerbitKunci"></code></div>
      <button class="tombol" id="terbitkan" disabled></button>
      <ul class="pabrik" id="pabrik"></ul>
    </div>
    <div class="blok">
      <h3 data-t="pilihSkenario"></h3>
      <div class="pilihan" id="pilihan"></div>
    </div>
  </div>
</aside>

<aside class="panel kanan kaca">
  <div class="kepala"><div class="kecil" style="--w:var(--toska)"><i></i><span data-t="jejak"></span></div><div class="konteks"><span data-t="konteksLbl"></span><code id="konteks">-</code></div></div>
  <div class="gulir">
    <div class="kosong" id="kosong"></div>
    <ol class="jejak" id="jejak" hidden></ol>
    <div class="banding" id="banding">
      <span data-t="buktiChip"></span><div class="heks" id="hBukti"></div>
      <span data-t="buktiHarapan"></span><div class="heks" id="hHarapan"></div>
    </div>
  </div>
</aside>

<div class="putusan kaca" id="putusan"><div class="cap" id="cap1"></div><p><span id="alasan"></span><small id="ringkas"></small></p></div>
<div class="petunjuk kaca" data-t="petunjuk"></div>
<div id="cap"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="isi kaca">
    <h2 data-t="tentangJ"></h2>
    <div class="tiga">
      <div style="--w:var(--ok)"><h3 data-t="nyataJ"></h3><p data-t="nyataP"></p></div>
      <div style="--w:var(--oranye)"><h3 data-t="modelJ"></h3><p data-t="modelP"></p></div>
      <div style="--w:var(--gagal)"><h3 data-t="klonJ"></h3><p data-t="klonP"></p></div>
    </div>
    <button class="tombol tutup" id="tutupInfo" data-t="tutup"></button>
  </div>
</div>

<script type="module" src="aplikasi.js"></script>
</body>
</html>
